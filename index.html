<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Dashboard - Perfecte Volgorde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .filter-btn.active { background-color: #1e293b; color: white; border-color: #1e293b; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .goal-card { transition: all 0.3s ease; border-width: 2px; }
        .goal-card:hover { transform: translateY(-5px); box-shadow: 0 25px 30px -10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-[#f9fafb] min-h-screen pb-20">

    <header class="bg-white border-b border-slate-100 sticky top-0 z-50 py-5 shadow-sm text-center md:text-left">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-slate-900 tracking-tight italic">ICT <span class="text-blue-600 uppercase tracking-tighter italic">Doelenzoeker</span></h1>
            <div id="conn-status" class="hidden md:block text-[10px] font-bold px-3 py-1 rounded-full bg-slate-100 text-slate-400 uppercase tracking-widest">Laden...</div>
        </div>
    </header>

    <main class="container mx-auto px-4 mt-10">
        
        <div id="main-content" class="hidden">
            <!-- Filter Dashboard -->
            <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-100 mb-10">
                <div class="mb-10">
                    <label class="text-[11px] font-black text-slate-300 uppercase tracking-[0.2em] mb-4 block">Selecteer Jaar / Fase</label>
                    <div id="grade-buttons" class="flex flex-wrap gap-2">
                        <button onclick="location.reload()" id="btn-all" class="filter-btn active px-6 py-2.5 rounded-2xl border border-slate-200 text-sm font-bold transition-all hover:bg-slate-50">Alle doelen</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <label class="text-[11px] font-black text-slate-300 uppercase tracking-[0.2em] mb-3 block">Zoek op trefwoord</label>
                        <input type="text" id="search-input" onkeyup="render()" placeholder="AI, muis, internet..." class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none ring-2 ring-transparent focus:ring-blue-100 transition-all font-semibold">
                    </div>
                    <div>
                        <label class="text-[11px] font-black text-slate-300 uppercase tracking-[0.2em] mb-3 block">Domein</label>
                        <select id="domain-select" onchange="render()" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none font-bold appearance-none cursor-pointer focus:ring-2 focus:ring-blue-100"></select>
                    </div>
                    <div>
                        <label class="text-[11px] font-black text-slate-300 uppercase tracking-[0.2em] mb-3 block">Doelsoort</label>
                        <select id="type-select" onchange="render()" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none font-bold appearance-none cursor-pointer focus:ring-2 focus:ring-blue-100">
                            <option value="all">Alle soorten</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="result-count" class="mb-8 text-xs font-bold text-slate-400 uppercase tracking-widest px-4"></div>
            
            <!-- Goals Grid -->
            <div id="goals-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <!-- Loader -->
        <div id="loading-screen" class="flex flex-col items-center justify-center py-40">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-6"></div>
            <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px]">Data live inladen...</p>
        </div>
    </main>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCFdDnFXhAe6lt-EzZ-VeHTg54dWNk-PuIDtYTN1hUd_yDxnhaUhdy1hQDx3QXjGtZIhmwUfIVe7az/pub?gid=1392774175&single=true&output=csv';
        
        let dataRows = [];
        let filterGrade = 'all';
        let colNames = { grade: '', domain: '', type: '', code: '', sub: '' };

        // De specifieke volgorde zoals gevraagd
        const gradeOrder = [
            "Fase 1", "Fase 2", "Fase 3", "Fase 4", "Fase 5",
            "Jongste kleuters", "2de kleuterklas", "3de kleuterklas",
            "Leerjaar 1", "Leerjaar 2", "Leerjaar 3", "Leerjaar 4", "Leerjaar 5", "Leerjaar 6",
            "Extra / Algemeen"
        ];

        async function init() {
            try {
                const response = await fetch(SHEET_URL);
                const csv = await response.text();
                Papa.parse(csv, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        dataRows = results.data;
                        identifyColumns(results.meta.fields);
                        setupUI();
                    }
                });
            } catch (e) { console.error(e); }
        }

        function identifyColumns(headers) {
            headers.forEach(h => {
                const lower = h.toLowerCase().trim();
                if (lower === 'code') colNames.code = h;
                if (lower.includes('jaar') || lower.includes('fase')) colNames.grade = h;
                if (lower === 'domein') colNames.domain = h;
                if (lower === 'soort') colNames.type = h;
                if (lower.includes('subdomein')) colNames.sub = h;
            });
        }

        function getTheme(domein) {
            const d = (domein || "").toLowerCase();
            if (d.includes("computationeel")) return { bg: "bg-indigo-50/70", border: "border-indigo-100", text: "text-indigo-700" };
            if (d.includes("veiligheid")) return { bg: "bg-rose-50/70", border: "border-rose-100", text: "text-rose-700" };
            if (d.includes("mediawijsheid")) return { bg: "bg-amber-50/70", border: "border-amber-100", text: "text-amber-700" };
            if (d.includes("creatie")) return { bg: "bg-emerald-50/70", border: "border-emerald-100", text: "text-emerald-700" };
            return { bg: "bg-blue-50/70", border: "border-blue-100", text: "text-blue-700" };
        }

        function setupUI() {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('conn-status').innerText = "Verbonden";
            document.getElementById('conn-status').className = "hidden md:block text-[10px] font-bold px-3 py-1 rounded-full bg-green-500 text-white uppercase tracking-widest";

            // Unieke leerjaren ophalen
            let uniqueGradesInExcel = [...new Set(dataRows.map(r => r[colNames.grade]?.trim() || "Extra / Algemeen"))];

            // Sorteren op basis van de gradeOrder lijst
            uniqueGradesInExcel.sort((a, b) => {
                let indexA = gradeOrder.indexOf(a);
                let indexB = gradeOrder.indexOf(b);
                if (indexA === -1) indexA = 999; // Als het niet in de lijst staat, zet achteraan
                if (indexB === -1) indexB = 999;
                return indexA - indexB;
            });

            const gCont = document.getElementById('grade-buttons');
            uniqueGradesInExcel.forEach(g => {
                const btn = document.createElement('button');
                btn.className = "filter-btn px-5 py-2.5 rounded-2xl border border-slate-200 text-sm font-bold transition-all hover:bg-slate-50";
                btn.innerText = g;
                btn.onclick = () => {
                    filterGrade = g;
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    render();
                };
                gCont.appendChild(btn);
            });

            const domains = [...new Set(dataRows.map(r => r[colNames.domain]))].filter(Boolean).sort();
            const dSel = document.getElementById('domain-select');
            dSel.innerHTML = '<option value="all">Alle domeinen</option>';
            domains.forEach(d => dSel.innerHTML += `<option value="${d}">${d}</option>`);

            const types = [...new Set(dataRows.map(r => r[colNames.type]))].filter(Boolean).sort();
            const tSel = document.getElementById('type-select');
            types.forEach(t => tSel.innerHTML += `<option value="${t}">${t}</option>`);

            render();
        }

        function render() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const domF = document.getElementById('domain-select').value;
            const typF = document.getElementById('type-select').value;
            const grid = document.getElementById('goals-grid');
            
            const filtered = dataRows.filter(r => {
                const currentVal = r[colNames.grade]?.trim() || "Extra / Algemeen";
                const mG = filterGrade === 'all' || currentVal === filterGrade;
                const mD = domF === 'all' || r[colNames.domain] === domF;
                const mT = typF === 'all' || r[colNames.type] === typF;
                const mS = (r.Leerplandoel || "").toLowerCase().includes(search) || (r.Voorbeelden || "").toLowerCase().includes(search);
                return mG && mD && mT && mS;
            });

            document.getElementById('result-count').innerText = `${filtered.length} resultaten`;
            grid.innerHTML = '';

            filtered.forEach(r => {
                const theme = getTheme(r[colNames.domain]);
                const card = document.createElement('div');
                card.className = `goal-card ${theme.bg} ${theme.border} p-8 rounded-[3rem] flex flex-col shadow-sm`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <div class="flex flex-col gap-2">
                            <div class="flex gap-2">
                                <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest bg-white ${theme.text} border border-slate-100 shadow-sm">${r[colNames.domain] || 'ICT'}</span>
                                <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest bg-slate-900 text-white shadow-sm">${r[colNames.type] || 'G'}</span>
                            </div>
                            <span class="text-[11px] font-bold text-slate-400 ml-1 tracking-wider uppercase italic">${r[colNames.grade] || 'Algemeen'}</span>
                        </div>
                        <div class="bg-white/80 px-3 py-1 rounded-xl border border-white shadow-sm">
                            <span class="text-sm font-black ${theme.text} tracking-tight italic">${r[colNames.code] || '#'}</span>
                        </div>
                    </div>
                    
                    <h3 class="text-slate-900 font-extrabold text-base leading-snug mb-4">
                        ${r[colNames.sub] || 'Doelstelling'}
                    </h3>

                    <div class="text-slate-600 text-sm leading-relaxed font-medium mb-8 bg-white/60 p-5 rounded-3xl border border-white/50 shadow-inner">
                        ${r.Leerplandoel || ''}
                    </div>
                    
                    ${r.Voorbeelden ? `
                    <div class="mt-auto">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="h-px bg-slate-200 flex-1"></div>
                            <span class="text-[9px] font-black text-slate-300 uppercase tracking-[0.2em]">Voorbeeld</span>
                            <div class="h-px bg-slate-200 flex-1"></div>
                        </div>
                        <p class="text-slate-400 text-xs italic leading-relaxed px-2 text-center line-clamp-3 hover:line-clamp-none transition-all">"${r.Voorbeelden}"</p>
                    </div>` : ''}
                `;
                grid.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
