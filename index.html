<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesplanner Leerplandoelen</title>
    <!-- Bibliotheken -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --brand-color: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; transition: all 0.4s ease; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .filter-btn.active { background-color: var(--brand-color) !important; color: white !important; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .goal-card { transition: all 0.3s ease; border: 1.5px solid rgba(226, 232, 240, 0.8); background: white; }
        .goal-card:hover { transform: translateY(-4px); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.1); border-color: var(--brand-color); }
        .section-title { position: relative; padding-left: 1.2rem; }
        .section-title::before { content: ''; position: absolute; left: 0; top: 0.2rem; bottom: 0.2rem; width: 5px; background: var(--brand-color); border-radius: 4px; transition: background 0.4s; }
        
        .list-row { border-bottom: 1px solid #f1f5f9; transition: all 0.2s; background: white; }
        .list-row.selected-row { border-left: 6px solid var(--brand-color); background: #f8fafc; }

        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; visibility: visible; }
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
        }
        #print-area { display: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20 text-slate-800 text-[13px]">

    <!-- Print Sectie (Enkel voor PDF) -->
    <div id="print-area" class="p-12 bg-white">
        <div style="border-bottom: 4px solid #333; padding-bottom: 15px; margin-bottom: 30px; text-align: left;">
            <h1 id="out-print-title" style="font-size: 28px; font-weight: 900; text-transform: uppercase; margin: 0;">Lesdoelen</h1>
            <p id="out-print-date" style="font-size: 11px; color: #777; margin-top: 5px; font-weight: 700;"></p>
        </div>
        <div id="out-print-content" style="text-align: left;"></div>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 text-white py-6 mb-8 shadow-2xl no-print relative overflow-hidden">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6 relative z-10 text-left">
            <div class="flex items-center gap-5">
                <div id="discipline-icon-bg" class="w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg transition-all duration-500" style="background-color: var(--brand-color);">
                    <span id="discipline-icon" class="text-white font-black text-2xl italic">L</span>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black tracking-tighter uppercase leading-none italic">
                        LEERPLAN<span id="header-accent" style="color: var(--brand-color);">DOELEN</span>
                    </h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="active-discipline-name" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Laden...</span>
                        <div id="conn-status" class="w-2.5 h-2.5 rounded-full bg-slate-600 transition-all border-2 border-slate-800 shadow-sm"></div>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 bg-white/5 p-1.5 rounded-2xl border border-white/10 shadow-inner">
                <button onclick="setView('grid')" id="grid-view-btn" class="p-2 px-5 rounded-xl text-[10px] font-black uppercase transition-all">Tegels</button>
                <button onclick="setView('list')" id="list-view-btn" class="p-2 px-5 rounded-xl text-[10px] font-black uppercase transition-all">Lijst</button>
            </div>
        </div>
    </header>

    <main id="main-content-area" class="container mx-auto px-4 no-print hidden text-left">
        <!-- Filter Paneel -->
        <div class="glass rounded-[2.5rem] shadow-xl border border-white mb-10 overflow-hidden text-left">
            <div onclick="toggleFilterPane()" class="p-5 md:px-10 md:py-6 flex justify-between items-center hover:bg-white/40 transition-all cursor-pointer border-b border-slate-100">
                <h2 class="section-title text-xl md:text-2xl font-black text-slate-900 tracking-tighter uppercase italic">Keuzeopties leerplandoelen</h2>
                <span id="filter-chevron" class="text-2xl font-bold">−</span>
            </div>
            
            <div id="filter-pane-content" class="px-6 md:px-10 pb-10 pt-6 space-y-8 text-left">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                    <div class="space-y-3">
                        <label class="text-[10px] font-black uppercase tracking-widest block ml-1" style="color: var(--brand-color);">1. Discipline</label>
                        <select id="discipline-selector" onchange="changeDiscipline(this.value)" class="w-full p-4 bg-white border border-slate-200 rounded-[1.2rem] font-bold text-[15px] shadow-sm focus:ring-4 outline-none transition-all cursor-pointer appearance-none text-left"></select>
                    </div>
                    <div class="md:col-span-3 space-y-3">
                        <div class="flex justify-between items-center ml-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">2. Doelgroep (Onthouden)</label>
                            <button onclick="toggleLegend()" class="text-[9px] font-bold text-slate-400 hover:text-slate-900 uppercase underline transition-all font-black italic">Fasen Info ℹ️</button>
                        </div>
                        <div id="grade-buttons" class="flex flex-wrap gap-2 text-left"></div>
                    </div>
                </div>

                <div id="legend-container" class="hidden p-8 bg-slate-900 rounded-[2rem] text-white shadow-2xl text-left italic">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 italic">
                        <div><h4 class="font-black text-blue-400 uppercase text-xs mb-2">P-route</h4><p class="text-slate-400">F1: 0-8m | F2: 6-18m | F3: 18m-2,5j</p></div>
                        <div class="border-l border-slate-800 pl-8"><h4 class="font-black text-blue-400 uppercase text-xs mb-2">S-route</h4><p class="text-slate-400">F4: +2,5j | F5: +6j | F6: +10j</p></div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-8 border-t border-slate-100 text-left">
                    <input type="text" id="search-input" onkeyup="render()" placeholder="🔍 Snel zoeken..." class="w-full p-4 bg-white border border-slate-200 rounded-2xl font-semibold shadow-sm focus:ring-4 outline-none transition-all text-[14px]">
                    <select id="domain-select" onchange="handleDomainChange()" class="p-4 bg-white border border-slate-200 rounded-2xl font-bold shadow-sm outline-none cursor-pointer text-[14px]"></select>
                    <select id="subdomain-select" onchange="handleSubdomainChange()" class="p-4 bg-white border border-slate-200 rounded-2xl font-bold shadow-sm outline-none cursor-pointer text-[14px]"></select>
                    <select id="cluster-select" onchange="render()" class="p-4 bg-white border border-slate-200 rounded-2xl font-bold shadow-sm outline-none cursor-pointer text-[14px]"></select>
                </div>
            </div>
        </div>

        <div id="result-count" class="mb-6 px-4 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] italic text-left">Laden...</div>
        <div id="goals-grid" class="pb-32 text-left"></div>
    </main>

    <!-- Floating Basket -->
    <div id="selection-drawer" class="fixed bottom-8 right-8 z-[100] no-print text-left">
        <div id="selection-list-box" class="hidden mb-6 w-80 md:w-[450px] bg-white rounded-[3rem] shadow-[0_20px_50px_rgba(0,0,0,0.25)] border border-slate-200 overflow-hidden flex flex-col max-h-[75vh]">
            <div class="p-8 bg-slate-900 text-white flex justify-between items-center shadow-lg">
                <div><h3 class="font-black text-sm uppercase tracking-widest italic text-blue-400">Mijn Lesdoelen</h3><p class="text-[9px] text-slate-400 font-bold uppercase mt-1">Planner</p></div>
                <button onclick="clearSelection()" class="text-[10px] underline opacity-50 hover:opacity-100 font-black uppercase tracking-tighter">Wis alles</button>
            </div>
            <div id="selection-items" class="p-8 overflow-y-auto bg-slate-50 space-y-4 flex-1 scrollbar-hide text-left"></div>
            <div class="p-8 bg-white border-t border-slate-100 flex flex-col gap-3">
                <div class="space-y-1 mb-2">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 text-left">PDF Titel:</label>
                    <input type="text" id="pdf-title-input" value="Lesdoelen" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl font-bold text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button id="btn-copy" onclick="copySelection()" class="w-full py-5 bg-blue-600 text-white rounded-[1.5rem] font-black text-xs uppercase tracking-widest hover:bg-blue-700 transition-all shadow-xl shadow-blue-100">📋 KOPIËREN</button>
                <button id="btn-pdf" onclick="printSelection()" class="w-full py-4 bg-slate-800 text-white rounded-[1.5rem] font-black text-[10px] uppercase tracking-widest hover:bg-black transition-all text-center italic">🖨️ AFDrukken / PDF</button>
            </div>
        </div>
        <button onclick="toggleSelectionDrawer()" class="group p-6 bg-blue-600 text-white rounded-[2.5rem] shadow-2xl hover:scale-110 active:scale-95 transition-all flex items-center gap-5 ring-8 ring-white relative">
            <span class="text-3xl">📋</span><span id="selection-counter" class="font-black text-2xl">0</span>
        </button>
    </div>

    <!-- Loader -->
    <div id="loading-screen" class="flex flex-col items-center justify-center py-48 text-center no-print">
        <div class="w-20 h-20 border-[10px] border-slate-200 border-t-blue-600 rounded-full animate-spin mb-8 shadow-inner"></div>
        <p id="loading-text" class="text-slate-400 font-black uppercase tracking-[0.4em] text-[10px] animate-pulse italic">Data synchroniseren...</p>
    </div>

    <script>
        const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCFdDnFXhAe6lt-EzZ-VeHTg54dWNk-PuIDtYTN1hUd_yDxnhaUhdy1hQDx3QXjGtZIhmwUfIVe7az/pub?output=csv&gid=';
        const DISCIPLINES = [
            { name: "ICT", gid: "1392774175", color: "#2563eb", icon: "🧠" },
            { name: "Wiskunde", gid: "795366275", color: "#e11d48", icon: "🔢" },
            { name: "Taal en Communicatie", gid: "1465352920", color: "#059669", icon: "🗣️" },
            { name: "Wetenschap en Techniek", gid: "2053307938", color: "#d97706", icon: "🔬" },
            { name: "Bewegingsopvoeding", gid: "1884684693", color: "#7c3aed", icon: "🏃" }
        ];

        const gradeMapping = { "F1.": "Fase 1", "F2.": "Fase 2", "F3.": "Fase 3", "F4.": "Fase 4", "F5.": "Fase 5", "F6.": "Fase 6", "JK.": "Jongste Kleuters", "K2.": "2de Kleuterklas", "K3.": "3de Kleuterklas", "L1.": "1ste Leerjaar", "L2.": "2de Leerjaar", "L3.": "3de Leerjaar", "L4.": "4de Leerjaar", "L5.": "5de Leerjaar", "L6.": "6de Leerjaar", "AN": "AN", "Extra": "Extra / Algemeen" };
        const gradeOrder = ["Fase 1", "Fase 2", "Fase 3", "Fase 4", "Fase 5", "Fase 6", "Jongste Kleuters", "2de Kleuterklas", "3de Kleuterklas", "1ste Leerjaar", "2de Leerjaar", "3de Leerjaar", "4de Leerjaar", "5de Leerjaar", "6de Leerjaar", "AN", "Extra / Algemeen"];

        let dataCache = {};
        let selectedGoals = JSON.parse(localStorage.getItem('mySelectedGoals')) || [];
        let viewMode = localStorage.getItem('preferredView') || 'grid';
        let filterGrade = localStorage.getItem('preferredGrade') || 'all';
        let activeDisciplineName = localStorage.getItem('preferredDiscipline') || DISCIPLINES[0].name;

        async function init() {
            const promises = DISCIPLINES.map(async (disc) => {
                try {
                    const response = await fetch(BASE_URL + disc.gid);
                    const csv = await response.text();
                    return new Promise((resolve) => {
                        Papa.parse(csv, { header: true, skipEmptyLines: true, complete: (results) => {
                            let cols = { code:'', grade:'', domain:'', type:'', sub:'', cluster:'', goal:'', example:'', vocab:'' };
                            results.meta.fields.forEach(h => {
                                const l = h.toLowerCase().trim();
                                if (l === 'code') cols.code = h;
                                else if (l.includes('jaar') || l.includes('fase')) cols.grade = h;
                                else if (l.includes('subdomein')) cols.sub = h;
                                else if (l.includes('cluster')) cols.cluster = h;
                                else if (l.includes('leerplandoel')) cols.goal = h;
                                else if (l.includes('voorbeeld')) cols.example = h;
                                else if (l.includes('woordenschat')) cols.vocab = h;
                                else if (l.includes('domein')) cols.domain = h;
                            });
                            dataCache[disc.name] = { rows: results.data, cols: cols };
                            resolve();
                        }});
                    });
                } catch (e) { console.error(e); }
            });
            await Promise.all(promises);
            setupInitialUI();
        }

        function setupInitialUI() {
            const selector = document.getElementById('discipline-selector');
            selector.innerHTML = DISCIPLINES.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
            
            setView(viewMode);
            showDiscipline(activeDisciplineName);
            updateSelectionUI();
            
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('main-content-area').classList.remove('hidden');
            updateStatusBadge('live');
        }

        function showDiscipline(name) {
            if(!dataCache[name]) return;
            activeDisciplineName = name;
            localStorage.setItem('preferredDiscipline', name);
            
            const disc = DISCIPLINES.find(d => d.name === name);
            document.documentElement.style.setProperty('--brand-color', disc.color);
            document.getElementById('discipline-icon-bg').style.backgroundColor = disc.color;
            document.getElementById('header-accent').style.color = disc.color;
            document.getElementById('active-discipline-name').innerText = name;
            document.getElementById('discipline-selector').value = name;
            
            setupFilters(dataCache[name]);
        }

        function setupFilters(data) {
            const gCont = document.getElementById('grade-buttons');
            gCont.innerHTML = '';
            const btnAll = document.createElement('button');
            btnAll.className = `filter-btn ${filterGrade === 'all' ? 'active' : ''} px-6 py-3 rounded-2xl border border-slate-200 text-sm font-bold uppercase shadow-sm bg-white`;
            btnAll.innerText = "Alles";
            btnAll.onclick = () => setGradeFilter('all', btnAll);
            gCont.appendChild(btnAll);

            let grades = [...new Set(data.rows.map(r => (r[data.cols.grade] || "").trim()))]
                .map(g => gradeMapping[g] || g || "Extra / Algemeen");
            let uniqueMapped = [...new Set(grades)].sort((a,b) => (gradeOrder.indexOf(a) === -1 ? 999 : gradeOrder.indexOf(a)) - (gradeOrder.indexOf(b) === -1 ? 999 : gradeOrder.indexOf(b)));
            
            uniqueMapped.forEach(g => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${filterGrade === g ? 'active' : ''} px-6 py-3 rounded-2xl border border-slate-200 text-sm font-bold shadow-sm bg-white uppercase`;
                btn.innerText = g;
                btn.onclick = () => setGradeFilter(g, btn);
                gCont.appendChild(btn);
            });

            fillDropdown('domain-select', data.cols.domain, 'Alle Domeinen', data.rows);
            handleDomainChange();
        }

        function handleDomainChange() {
            const data = dataCache[activeDisciplineName];
            const domVal = document.getElementById('domain-select').value;
            let rows = domVal === 'all' ? data.rows : data.rows.filter(r => r[data.cols.domain] === domVal);
            fillDropdown('subdomain-select', data.cols.sub, 'Alle Subdomeinen', rows);
            document.getElementById('subdomain-select').value = 'all';
            handleSubdomainChange();
        }

        function handleSubdomainChange() {
            const data = dataCache[activeDisciplineName];
            const domVal = document.getElementById('domain-select').value;
            const subVal = document.getElementById('subdomain-select').value;
            let rows = data.rows;
            if (domVal !== 'all') rows = rows.filter(r => r[data.cols.domain] === domVal);
            if (subVal !== 'all') rows = rows.filter(r => r[data.cols.sub] === subVal);
            fillDropdown('cluster-select', data.cols.cluster, 'Alle Clusters', rows);
            document.getElementById('cluster-select').value = 'all';
            render();
        }

        function render() {
            const data = dataCache[activeDisciplineName];
            if(!data) return;
            const q = document.getElementById('search-input').value.toLowerCase();
            const domF = document.getElementById('domain-select').value;
            const subdomF = document.getElementById('subdomain-select').value;
            const clusterF = document.getElementById('cluster-select').value;
            const grid = document.getElementById('goals-grid');
            
            const filtered = data.rows.filter(r => {
                const mappedGrade = gradeMapping[(r[data.cols.grade] || "").trim()] || (r[data.cols.grade] || "").trim() || "Extra / Algemeen";
                return (filterGrade === 'all' || mappedGrade === filterGrade) && (domF === 'all' || r[data.cols.domain] === domF) && (subdomF === 'all' || r[data.cols.sub] === subdomF) && (clusterF === 'all' || r[data.cols.cluster] === clusterF) &&
                       ((r[data.cols.goal] || "").toLowerCase().includes(q) || (r[data.cols.sub] || "").toLowerCase().includes(q));
            });

            document.getElementById('result-count').innerText = `${filtered.length} DOELEN GEVONDEN`;
            
            if (viewMode === 'list') {
                grid.className = "flex flex-col glass rounded-3xl overflow-hidden shadow-lg border border-slate-200";
                grid.innerHTML = filtered.map((r, idx) => {
                    const rawIdx = data.rows.indexOf(r);
                    const isSelected = selectedGoals.some(g => (g.code + g.goal) === (r[data.cols.code] + r[data.cols.goal]));
                    return `
                    <div id="list-row-${idx}" class="list-row group flex flex-col ${isSelected ? 'selected-row' : ''}">
                        <div class="flex items-center p-5 cursor-pointer text-left" onclick="toggleListRow(${idx})">
                            <div class="w-24 font-black text-blue-600 text-[10px]">#${r[data.cols.code] || ''}</div>
                            <div class="flex-1">
                                <div class="font-black text-slate-900 uppercase tracking-tighter text-[13px] mb-1">${r[data.cols.sub]}</div>
                                <div class="text-slate-500 font-bold text-[13px] line-clamp-1 opacity-80">${r[data.cols.goal]}</div>
                            </div>
                            <div class="w-32 text-[10px] font-bold text-slate-400 uppercase italic pr-6 text-right">${gradeMapping[(r[data.cols.grade] || "").trim()] || 'Algemeen'}</div>
                            <button onclick="event.stopPropagation(); toggleSelection('${activeDisciplineName}', ${rawIdx}, this)" 
                                    class="w-10 h-10 flex items-center justify-center text-white rounded-xl shadow-lg transition-all ${isSelected ? 'bg-red-500' : 'bg-blue-600'}">
                                <span class="text-xl font-bold">${isSelected ? '−' : '＋'}</span>
                            </button>
                        </div>
                        <div id="list-detail-${idx}" class="hidden p-8 bg-slate-50/50 border-t border-slate-100 text-left">
                            <p class="text-[17px] leading-relaxed font-black text-slate-800 mb-4 italic">${r[data.cols.goal]}</p>
                            ${r[data.cols.vocab] ? `<p class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">🏷️ ${r[data.cols.vocab]}</p>` : ''}
                            ${r[data.cols.example] ? `<div class="p-6 bg-white rounded-2xl border border-slate-200 text-slate-500 text-[13px] font-medium leading-relaxed italic shadow-inner">💡 ${r[data.cols.example]}</div>` : ''}
                        </div>
                    </div>`;
                }).join('');
            } else {
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-24";
                grid.innerHTML = filtered.map((r, idx) => {
                    const rawIdx = data.rows.indexOf(r);
                    const isSelected = selectedGoals.some(g => (g.code + g.goal) === (r[data.cols.code] + r[data.cols.goal]));
                    const domStyle = getTheme(r[data.cols.domain]);
                    return `
                    <div class="goal-card glass p-8 rounded-[3rem] flex flex-col shadow-sm border-2 text-left ${isSelected ? 'ring-4 ring-red-500/20 border-red-500 bg-red-50/10' : ''}">
                        <div class="flex justify-between items-start mb-6">
                            <div class="flex flex-col gap-1">
                                <div class="flex gap-2 text-left"><span class="px-3 py-1 rounded-full font-black uppercase bg-white ${domStyle.text} border border-slate-100 shadow-sm text-[8px]">${r[data.cols.domain] || 'ALGEMEEN'}</span></div>
                                <span class="font-bold text-slate-400 ml-1 tracking-wider uppercase italic text-[10px]">${gradeMapping[(r[data.cols.grade] || "").trim()] || 'Algemeen'}</span>
                            </div>
                            <div class="bg-slate-900/5 px-3 py-1 rounded-xl border border-white shadow-sm font-black text-sm text-right">#${r[data.cols.code] || ''}</div>
                        </div>
                        <h3 class="text-slate-900 font-extrabold text-[15px] leading-snug mb-4 uppercase tracking-tighter text-left">${r[data.cols.sub] || ''}</h3>
                        <div class="text-slate-700 text-[13px] leading-relaxed font-semibold bg-white/70 p-6 rounded-[2rem] border border-white/50 shadow-inner mb-4 flex-1 text-left">${r[data.cols.goal] || ''}</div>
                        <div class="mt-auto space-y-3">
                            <button onclick="toggleSelection('${activeDisciplineName}', ${rawIdx}, this)" 
                                    class="w-full py-4 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all shadow-lg ${isSelected ? 'bg-red-500' : 'bg-blue-600'}">
                                ${isSelected ? '− Verwijderen uit lesfiche' : '＋ Toevoegen aan lesfiche'}
                            </button>
                            ${r[data.cols.example] ? `
                                <div id="ex-${idx}" class="hidden bg-white/60 p-5 rounded-2xl border border-white shadow-sm mb-2 text-slate-600 italic text-[12px]">"${r[data.cols.example]}"</div>
                                <button id="btn-ex-${idx}" onclick="toggleExample(${idx})" class="w-full py-3 rounded-2xl bg-slate-100 text-slate-400 text-[9px] font-black uppercase hover:bg-white border border-white/50 transition-all">Praktijkvoorbeeld 💡</button>
                            ` : ''}
                        </div>
                    </div>`;
                }).join('');
            }
        }

        // --- ACTIES ---
        function toggleSelection(disc, idx, btn) {
            const item = dataCache[disc].rows[idx];
            const cols = dataCache[disc].cols;
            const goalId = (item[cols.code] || '') + item[cols.goal];
            const existingIdx = selectedGoals.findIndex(g => (g.code + g.goal) === goalId);

            if (existingIdx > -1) {
                selectedGoals.splice(existingIdx, 1);
            } else {
                selectedGoals.push({ disc, code: item[cols.code], sub: item[cols.sub], goal: item[cols.goal], grade: gradeMapping[(item[cols.grade] || "").trim()] || 'Algemeen', vocab: item[cols.vocab] || '' });
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.8 }, colors: [DISCIPLINES.find(d => d.name === disc).color, '#ffffff'] });
            }
            
            localStorage.setItem('mySelectedGoals', JSON.stringify(selectedGoals));
            updateSelectionUI();
            render();
        }

        function copySelection() {
            if (selectedGoals.length === 0) return;
            const text = selectedGoals.map(g => `[${g.disc}] ${g.code}: ${g.sub}\nDOEL: ${g.goal}`).join('\n---\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('btn-copy');
                const oldText = btn.innerText;
                btn.innerText = "✅ GEKOPIEERD NAAR KLEMBORD";
                setTimeout(() => { btn.innerText = oldText; }, 2000);
            });
        }

        function printSelection() {
            const area = document.getElementById('out-print-content');
            const customTitle = document.getElementById('pdf-title-input').value || "Mijn Lesdoelen";
            if (selectedGoals.length === 0) return alert("Niets geselecteerd.");
            
            document.getElementById('out-print-title').innerText = customTitle;
            document.getElementById('out-print-date').innerText = "Aangemaakt op: " + new Date().toLocaleDateString('nl-BE');
            
            area.innerHTML = selectedGoals.map(g => `
                <div class="print-item" style="border-bottom: 1px solid #ddd; margin-bottom: 20px; padding-bottom: 10px;">
                    <div style="font-size: 10px; font-weight: 800; color: #888;">${g.disc} • ${g.grade} • #${g.code}</div>
                    <h2 style="font-size: 16px; font-weight: 900; margin: 5px 0;">${g.sub}</h2>
                    <p style="font-size: 14px; line-height: 1.6;">${g.goal}</p>
                </div>`).join('');
            
            setTimeout(() => window.print(), 500);
        }

        // --- HELPERS ---
        function setGradeFilter(g, btn) { filterGrade = g; localStorage.setItem('preferredGrade', g); document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
        function setView(m) { viewMode = m; localStorage.setItem('preferredView', m); render(); }
        function toggleFilterPane() { document.getElementById('filter-pane-content').classList.toggle('hidden'); }
        function toggleLegend() { document.getElementById('legend-container').classList.toggle('hidden'); }
        function toggleSelectionDrawer() { document.getElementById('selection-list-box').classList.toggle('hidden'); }
        function toggleListRow(i) { document.getElementById(`list-detail-${i}`).classList.toggle('hidden'); }
        function toggleExample(i) { const e = document.getElementById(`ex-${i}`); e.classList.toggle('hidden'); document.getElementById(`btn-ex-${i}`).innerText = e.classList.contains('hidden') ? "Praktijkvoorbeeld 💡" : "Dichtklappen 🔼"; }
        function updateSelectionUI() {
            document.getElementById('selection-counter').innerText = selectedGoals.length;
            const container = document.getElementById('selection-items');
            if (selectedGoals.length === 0) { container.innerHTML = `<p class="italic text-center py-10 opacity-40">Mandje is leeg.</p>`; return; }
            container.innerHTML = selectedGoals.map((g, i) => `
                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm relative text-left mb-3">
                    <button onclick="removeFromBasket(${i})" class="absolute top-4 right-4 text-red-500 font-bold">✕</button>
                    <div class="text-[9px] font-black text-blue-600 uppercase mb-1">#${g.code} | ${g.disc}</div>
                    <div class="font-bold text-slate-800 uppercase tracking-tighter leading-tight text-[11px] mb-2">${g.sub}</div>
                    <div class="text-[10px] text-slate-500 border-t pt-2">${g.goal}</div>
                </div>`).join('');
        }
        function removeFromBasket(i) { selectedGoals.splice(i, 1); localStorage.setItem('mySelectedGoals', JSON.stringify(selectedGoals)); updateSelectionUI(); render(); }
        function clearSelection() { if(confirm("Mandje legen?")) { selectedGoals = []; localStorage.removeItem('mySelectedGoals'); updateSelectionUI(); render(); } }
        function fillDropdown(id, k, t, r) { const e = document.getElementById(id); if(!e || !k) return; const items = [...new Set(r.map(x => x[k]))].filter(Boolean).sort(); e.innerHTML = `<option value="all">${t}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join(''); }
        function changeDiscipline(n) { showDiscipline(n); }
        function updateStatusBadge(s) { const e = document.getElementById('conn-status'); if(e) e.style.backgroundColor = s === 'live' ? '#10b981' : '#64748b'; }
        function getTheme(dom) { const d = (dom || "").toLowerCase(); if (d.includes("computationeel") || d.includes("ict")) return { text: "text-indigo-700" }; if (d.includes("getallen") || d.includes("taal")) return { text: "text-rose-700" }; if (d.includes("meten") || d.includes("techniek")) return { text: "text-amber-700" }; return { text: "text-blue-700" }; }

        window.onload = init;
    </script>
</body>
</html>
