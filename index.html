<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Dashboard - Volledig Hersteld</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .filter-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; transform: scale(1.05); }
        .loading-spinner { border-top-color: #2563eb; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .goal-card { transition: all 0.2s ease-in-out; }
        .goal-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <header class="bg-blue-700 text-white p-6 shadow-lg mb-8">
        <div class="container mx-auto">
            <h1 class="text-2xl font-black tracking-tight uppercase">ICT Doelen Dashboard</h1>
            <div id="connection-status" class="inline-block mt-2 text-[10px] bg-blue-800 px-3 py-1 rounded-full text-blue-200 font-bold uppercase tracking-widest">
                Data laden...
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4">
        
        <!-- Filter Paneel -->
        <div id="ui-pane" class="hidden">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 mb-8">
                <div class="mb-6">
                    <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-3">Filter op Leerjaar / Fase</label>
                    <div id="grade-filters" class="flex flex-wrap gap-2">
                        <button onclick="setGrade('all')" id="btn-all" class="filter-btn active px-5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold transition-all shadow-sm">Alle</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Zoeken</label>
                        <input type="text" id="search-input" onkeyup="render()" placeholder="Typ een onderwerp (AI, muis, privacy...)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2">Domein</label>
                        <select id="domain-filter" onchange="render()" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-medium appearance-none cursor-pointer"></select>
                    </div>
                </div>
            </div>

            <div id="stats" class="mb-6 text-xs font-black text-slate-400 uppercase tracking-widest px-2"></div>
            <div id="goals-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- Loader -->
        <div id="loader" class="flex flex-col items-center justify-center py-32 text-center">
            <div class="loading-spinner w-12 h-12 border-4 border-slate-200 rounded-full mb-6"></div>
            <p class="text-slate-400 font
