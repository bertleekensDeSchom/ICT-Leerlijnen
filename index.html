<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-Leerplandoelen Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --brand-color: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; text-align: left; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .filter-btn { transition: all 0.2s ease; }
        .filter-btn.active { background-color: #1e293b !important; color: white !important; transform: scale(1.05); }
        .goal-card { transition: all 0.3s ease; border: 1.5px solid rgba(226, 232, 240, 0.8); background: white; }
        .goal-card.selected { border-color: #ef4444; background-color: #fef2f2; }
        .section-title { position: relative; padding-left: 1.2rem; cursor: pointer; }
        .section-title::before { content: ''; position: absolute; left: 0; top: 0.2rem; bottom: 0.2rem; width: 5px; background: #2563eb; border-radius: 4px; }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: white; }
            .no-print { display: none !important; }
        }
        #print-area { display: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20 text-slate-800 text-[13px]">

    <!-- Print Sectie -->
    <div id="print-area" class="p-10 text-left">
        <div style="border-bottom: 4px solid #000; padding-bottom: 10px; margin-bottom: 30px;">
            <h1 id="pdf-title-output" style="font-size: 26px; font-weight: 900; text-transform: uppercase;">Lesdoelen</h1>
            <p id="print-date" style="font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 2px;"></p>
        </div>
        <div id="print-content-list"></div>
    </div>

    <!-- Header -->
    <header class="bg-slate-900 text-white py-6 mb-8 shadow-2xl no-print relative text-left">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center shadow-lg">
                    <span class="text-white font-black text-2xl italic">L</span>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-black tracking-tighter uppercase leading-none italic">LEERPLAN<span class="text-blue-500">DOELEN</span></h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="active-header-name" class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Synchroniseren...</span>
                        <div id="conn-status" class="w-2.5 h-2.5 rounded-full bg-slate-600 border-2 border-slate-800"></div>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-3 bg-white/5 p-1.5 rounded-2xl border border-white/10">
                <button onclick="setView('grid')" id="grid-view-btn" class="p-2 px-5 rounded-xl text-[10px] font-black uppercase transition-all bg-white/10 text-white shadow-inner">Tegels</button>
                <button onclick="setView('list')" id="list-view-btn" class="p-2 px-5 rounded-xl text-[10px] font-black uppercase transition-all text-slate-400">Lijst</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 no-print text-left">
        <div id="main-content" class="hidden">
            <!-- Filter Paneel -->
            <div class="glass rounded-[2.5rem] shadow-xl border border-white mb-10 overflow-hidden">
                <div onclick="toggleFilterPane()" class="p-5 md:px-10 md:py-6 flex justify-between items-center hover:bg-white/40 transition-all cursor-pointer border-b border-slate-100">
                    <h2 class="section-title text-xl md:text-2xl font-black text-slate-900 tracking-tighter uppercase italic">Keuzeopties leerplandoelen</h2>
                    <span id="filter-chevron" class="text-2xl font-bold">−</span>
                </div>
                
                <div id="filter-pane-content" class="px-6 md:px-10 pb-10 pt-6 space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                        <div class="space-y-3">
                            <label class="text-[10px] font-black text-blue-600 uppercase tracking-widest block ml-1">1. Discipline</label>
                            <select id="discipline-selector" onchange="changeDiscipline(this.value)" class="w-full p-4 bg-white border border-slate-200 rounded-[1.2rem] font-bold text-[16px] shadow-sm outline-none text-blue-700"></select>
                        </div>
                        <div class="md:col-span-3 space-y-3">
                            <div class="flex justify-between items-center ml-1">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest uppercase">2. Doelgroep (Onthouden)</label>
                                <button onclick="toggleLegend()" class="text-[9px] font-bold text-slate-400 hover:text-slate-900 uppercase underline italic font-black">Legende fasen ℹ️</button>
                            </div>
                            <div id="grade-buttons" class="flex flex-wrap gap-2"></div>
                        </div>
                    </div>

                    <div id="legend-container" class="hidden p-8 bg-slate-900 rounded-[2rem] text-white shadow-2xl italic">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div><h4 class="font-black text-blue-400 uppercase text-[10px] mb-2">P-route</h4><p class="text-slate-300">F1: 0-8m | F2: 6-18m | F3: 18m-2,5j</p></div>
                            <div class="border-l border-slate-700 pl-8"><h4 class="font-black text-blue-400 uppercase text-[10px] mb-2">S-route</h4><p class="text-slate-300">F4: +2,5j | F5: +6j | F6: +10j</p></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 pt-8 border-t border-slate-100">
                        <input type="text" id="search-input" onkeyup="render()" placeholder="🔍 Zoek tekst..." class="p-4 bg-white border border-slate-200 rounded-2xl font-semibold shadow-sm focus:ring-4 outline-none text-[15px]">
                        <select id="domain-select" onchange="handleDomainChange()" class="p-4 bg-white border border-slate-200 rounded-2xl font-bold shadow-sm cursor-pointer text-[15px]"></select>
                        <select id="subdomain-select" onchange="handleSubdomainChange()" class="p-4 bg-white border border-slate-200 rounded-2xl font-bold shadow-sm cursor-pointer text-[15px]"></select>
                        <select id="cluster-select" onchange="render()" class="p-4 bg-white border border-slate-200 rounded-2xl font-bold shadow-sm cursor-pointer text-[15px]"></select>
                    </div>
                </div>
            </div>

            <div id="result-count" class="mb-6 px-4 text-[11px] font-black text-slate-400 uppercase tracking-widest italic">0 DOELEN GEVONDEN</div>
            <div id="goals-grid" class="pb-32"></div>
        </div>

        <!-- Floating Selection (Mandje) -->
        <div id="selection-drawer" class="fixed bottom-8 right-8 z-[100] no-print">
            <div id="selection-list-box" class="hidden mb-6 w-80 md:w-[450px] bg-white rounded-[3rem] shadow-[0_20px_50px_rgba(0,0,0,0.25)] border border-slate-200 overflow-hidden flex flex-col max-h-[75vh]">
                <div class="p-8 bg-slate-900 text-white flex justify-between items-center shadow-lg">
                    <div><h3 class="font-black text-sm uppercase tracking-widest italic text-blue-400">Mijn Lesdoelen</h3><p class="text-[9px] text-slate-400 font-bold uppercase mt-1">Samenstellen</p></div>
                    <button onclick="clearSelection()" class="text-[10px] underline opacity-70 hover:opacity-100 font-black uppercase">Wis alles</button>
                </div>
                <div id="selection-items" class="p-8 overflow-y-auto bg-slate-50 space-y-4 flex-1 scrollbar-hide text-left">
                    Nog geen doelen gekozen.
                </div>
                <div class="p-8 bg-white border-t border-slate-100 flex flex-col gap-3">
                    <div class="space-y-1 mb-2">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Titel op PDF:</label>
                        <input type="text" id="pdf-title-input" value="Lesdoelen" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button onclick="exportSelection()" class="w-full py-5 bg-blue-600 text-white rounded-[1.5rem] font-black text-xs uppercase tracking-widest hover:bg-blue-700 transition-all shadow-xl">📋 KOPIËREN VOOR LESFICHE</button>
                    <button onclick="printSelection()" class="w-full py-3 bg-slate-100 text-slate-600 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-slate-200 transition-all italic text-center">🖨️ PDF / AFDRUKKEN</button>
                </div>
            </div>
            <button onclick="toggleSelectionDrawer()" class="group p-6 bg-blue-600 text-white rounded-[2.5rem] shadow-2xl hover:scale-110 active:scale-95 transition-all flex items-center gap-5 ring-8 ring-white relative">
                <span class="text-3xl">📋</span><span id="selection-counter" class="font-black text-2xl leading-none">0</span>
            </button>
        </div>

        <!-- Loader -->
        <div id="loading-screen" class="flex flex-col items-center justify-center py-48 text-center no-print">
            <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4 shadow-sm"></div>
            <p id="loading-text" class="text-slate-400 font-bold uppercase tracking-widest text-[10px] animate-pulse font-black italic">Database laden (0/5)...</p>
        </div>
    </main>

    <script>
        const BASE_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCFdDnFXhAe6lt-EzZ-VeHTg54dWNk-PuIDtYTN1hUd_yDxnhaUhdy1hQDx3QXjGtZIhmwUfIVe7az/pub?output=csv&gid=';
        const DISCIPLINES = [
            { name: "ICT", gid: "1392774175", color: "#2563eb", icon: "🧠" },
            { name: "Wiskunde", gid: "795366275", color: "#e11d48", icon: "🔢" },
            { name: "Taal en Communicatie", gid: "1465352920", color: "#059669", icon: "🗣️" },
            { name: "Wetenschap en Techniek", gid: "2053307938", color: "#d97706", icon: "🔬" },
            { name: "Bewegingsopvoeding", gid: "1884684693", color: "#7c3aed", icon: "🏃" }
        ];

        const gradeMapping = { 
            "F1.": "Fase 1", "F2.": "Fase 2", "F3.": "Fase 3", "F4.": "Fase 4", "F5.": "Fase 5", "F6.": "Fase 6", 
            "JK.": "Jongste Kleuters", "K2.": "2de Kleuterklas", "K3.": "3de Kleuterklas", 
            "L1.": "1ste Leerjaar", "L2.": "2de Leerjaar", "L3.": "3de Leerjaar", "L4.": "4de Leerjaar", "L5.": "5de Leerjaar", "L6.": "6de Leerjaar", 
            "AN": "AN", "Extra": "Extra / Algemeen" 
        };

        const gradeOrder = ["Fase 1", "Fase 2", "Fase 3", "Fase 4", "Fase 5", "Fase 6", "Jongste Kleuters", "2de Kleuterklas", "3de Kleuterklas", "1ste Leerjaar", "2de Leerjaar", "3de Leerjaar", "4de Leerjaar", "5de Leerjaar", "6de Leerjaar", "AN", "Extra / Algemeen"];

        let dataCache = {};
        let selectedGoals = JSON.parse(localStorage.getItem('mySelectedGoals')) || [];
        let viewMode = localStorage.getItem('preferredView') || 'grid';
        let filterGrade = localStorage.getItem('preferredGrade') || 'all';
        let activeDisciplineName = localStorage.getItem('preferredDiscipline') || DISCIPLINES[0].name;

        // --- DATA INLADEN ---
        async function init() {
            let loadedCount = 0;
            const total = DISCIPLINES.length;
            const promises = DISCIPLINES.map(async (disc) => {
                try {
                    const response = await fetch(BASE_URL + disc.gid);
                    if (!response.ok) return;
                    const csv = await response.text();
                    return new Promise((resolve) => {
                        Papa.parse(csv, { header: true, skipEmptyLines: true, complete: (results) => {
                            let cols = { code:'', grade:'', domain:'', type:'', sub:'', cluster:'', goal:'', example:'', vocab:'' };
                            if (results.meta.fields) {
                                results.meta.fields.forEach(h => {
                                    const l = h.toLowerCase().trim();
                                    if (l === 'code') cols.code = h;
                                    else if (l.includes('jaar') || l.includes('fase')) cols.grade = h;
                                    else if (l.includes('subdomein')) cols.sub = h;
                                    else if (l.includes('cluster')) cols.cluster = h;
                                    else if (l.includes('leerplandoel')) cols.goal = h;
                                    else if (l.includes('voorbeeld')) cols.example = h;
                                    else if (l.includes('woordenschat')) cols.vocab = h;
                                    else if (l.includes('domein')) cols.domain = h;
                                    else if (l.includes('soort')) cols.type = h;
                                });
                            }
                            dataCache[disc.name] = { rows: results.data, cols: cols };
                            loadedCount++;
                            const textEl = document.getElementById('loading-text');
                            if(textEl) textEl.innerText = `Database laden (${loadedCount}/${total})...`;
                            resolve();
                        }});
                    });
                } catch (e) { console.error(e); resolve(); }
            });

            await Promise.all(promises);
            finalizeUI();
        }

        function finalizeUI() {
            const discSelector = document.getElementById('discipline-selector');
            if(!discSelector) return;

            discSelector.innerHTML = DISCIPLINES.map(d => `<option value="${d.name}">${d.name}</option>`).join('');
            
            showDiscipline(activeDisciplineName);
            updateSelectionUI();
            
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            updateStatusBadge('live');
        }

        // --- FILTERS & RENDER ---
        function showDiscipline(name) {
            if(!dataCache[name]) name = DISCIPLINES[0].name;
            activeDisciplineName = name;
            localStorage.setItem('preferredDiscipline', name);
            
            const disc = DISCIPLINES.find(d => d.name === name);
            document.documentElement.style.setProperty('--brand-color', disc.color);
            
            const header = document.getElementById('active-header-name');
            const selector = document.getElementById('discipline-selector');
            if(header) header.innerText = name;
            if(selector) selector.value = name;

            setupGradeButtons(dataCache[name]);
            handleDomainChange(); 
        }

        function setupGradeButtons(data) {
            const gCont = document.getElementById('grade-buttons');
            if(!gCont) return;
            gCont.innerHTML = '';
            
            const btnAll = document.createElement('button');
            btnAll.className = `filter-btn ${filterGrade === 'all' ? 'active' : ''} px-5 py-2.5 rounded-xl border border-slate-200 text-sm font-black uppercase shadow-sm bg-white`;
            btnAll.innerText = "Alles";
            btnAll.onclick = () => setGrade('all', btnAll);
            gCont.appendChild(btnAll);

            let rawGrades = [...new Set(data.rows.map(r => (r[data.cols.grade] || "").trim()))];
            let mapped = [...new Set(rawGrades.map(g => gradeMapping[g] || g || "Extra / Algemeen"))];
            mapped.sort((a, b) => (gradeOrder.indexOf(a) === -1 ? 998 : gradeOrder.indexOf(a)) - (gradeOrder.indexOf(b) === -1 ? 998 : gradeOrder.indexOf(b)));
            
            mapped.forEach(g => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${filterGrade === g ? 'active' : ''} px-5 py-2.5 rounded-xl border border-slate-200 text-sm font-black shadow-sm bg-white uppercase`;
                btn.innerText = g;
                btn.onclick = () => setGrade(g, btn);
                gCont.appendChild(btn);
            });
        }

        function handleDomainChange() {
            const d = dataCache[activeDisciplineName];
            const v = document.getElementById('domain-select')?.value || 'all';
            let rows = v === 'all' ? d.rows : d.rows.filter(r => r[d.cols.domain] === v);
            fillDropdown('domain-select', d.cols.domain, 'Alle Domeinen', d.rows);
            document.getElementById('domain-select').value = v;
            
            fillDropdown('subdomain-select', d.cols.sub, 'Alle Subdomeinen', rows);
            document.getElementById('subdomain-select').value = 'all';
            handleSubdomainChange();
        }

        function handleSubdomainChange() {
            const d = dataCache[activeDisciplineName];
            const dv = document.getElementById('domain-select')?.value || 'all';
            const sv = document.getElementById('subdomain-select')?.value || 'all';
            let rows = d.rows;
            if (dv !== 'all') rows = rows.filter(r => r[d.cols.domain] === dv);
            if (sv !== 'all') rows = rows.filter(r => r[d.cols.sub] === sv);
            fillDropdown('cluster-select', d.cols.cluster, 'Alle Clusters', rows);
            document.getElementById('cluster-select').value = 'all';
            render();
        }

        function fillDropdown(id, key, defaultText, rows) {
            const el = document.getElementById(id);
            if (!el || !key) return;
            const items = [...new Set(rows.map(r => r[key]))].filter(Boolean).sort();
            el.innerHTML = `<option value="all">${defaultText}</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
        }

        function render() {
            const data = dataCache[activeDisciplineName];
            const q = document.getElementById('search-input')?.value?.toLowerCase() || "";
            const domF = document.getElementById('domain-select')?.value || 'all';
            const subdomF = document.getElementById('subdomain-select')?.value || 'all';
            const clusterF = document.getElementById('cluster-select')?.value || 'all';
            const grid = document.getElementById('goals-grid');
            if(!grid || !data) return;

            const filtered = data.rows.filter(r => {
                const rawG = (r[data.cols.grade] || "").trim();
                const mappedGrade = gradeMapping[rawG] || rawG || "Extra / Algemeen";
                const matchesSearch = ((r[data.cols.goal] || "").toLowerCase().includes(q) || (r[data.cols.sub] || "").toLowerCase().includes(q));
                return (filterGrade === 'all' || mappedGrade === filterGrade) && 
                       (domF === 'all' || r[data.cols.domain] === domF) && 
                       (subdomF === 'all' || r[data.cols.sub] === subdomF) && 
                       (clusterF === 'all' || r[data.cols.cluster] === clusterF) && matchesSearch;
            });

            document.getElementById('result-count').innerText = `${filtered.length} DOELEN GEVONDEN`;

            grid.innerHTML = filtered.map((r, idx) => {
                const isSelected = selectedGoals.some(g => g.code === r[data.cols.code] && g.goal === r[data.cols.goal]);
                const mappedGrade = gradeMapping[(r[data.cols.grade] || "").trim()] || r[data.cols.grade] || 'Algemeen';
                const theme = getTheme(r[data.cols.domain]);
                const rawIdx = data.rows.indexOf(r);

                if (viewMode === 'list') {
                    return `<div class="list-row group flex flex-col ${isSelected ? 'expanded' : ''}">
                        <div class="flex items-center p-4 cursor-pointer" onclick="toggleListRow(${idx})">
                            <div class="w-20 font-black text-blue-600 text-[10px]">#${r[data.cols.code] || ''}</div>
                            <div class="flex-1 text-left"><div class="font-black text-slate-900 uppercase tracking-tighter text-[13px]">${r[data.cols.sub]}</div><div class="text-slate-500 font-bold text-[12px] line-clamp-1 opacity-70">${r[data.cols.goal]}</div></div>
                            <div class="w-32 text-[10px] font-bold text-slate-400 uppercase italic pr-6 text-right">${mappedGrade}</div>
                            <button onclick="event.stopPropagation(); toggleGoalSelection('${activeDisciplineName}', ${rawIdx}, this)" class="w-10 h-10 flex items-center justify-center text-white rounded-xl shadow-lg ring-2 ring-white transition-all ${isSelected ? 'bg-red-500' : 'bg-blue-600'}">${isSelected ? '−' : '＋'}</button>
                        </div>
                        <div id="list-detail-${idx}" class="hidden p-8 bg-slate-50 border-t border-slate-100 text-left italic">
                            <p class="text-[17px] leading-relaxed font-bold text-slate-800 mb-4 text-left uppercase">${r[data.cols.goal]}</p>
                            ${r[data.cols.vocab] ? `<p class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest font-mono">🏷️ ${r[data.cols.vocab]}</p>` : ''}
                            ${r[data.cols.example] ? `<div class="p-6 bg-white rounded-2xl border border-slate-200 text-slate-500 text-[13px] font-medium leading-relaxed italic">💡 ${r[data.cols.example]}</div>` : ''}
                        </div>
                    </div>`;
                } else {
                    return `<div class="goal-card glass p-8 rounded-[3rem] flex flex-col shadow-sm border-2 text-left ${isSelected ? 'ring-4 ring-red-500/20 border-red-500 bg-red-50/10' : ''}">
                        <div class="flex justify-between items-start mb-6">
                            <div class="flex flex-col gap-1 text-left">
                                <div class="flex gap-2"><span class="px-3 py-1 rounded-full font-black uppercase bg-white ${theme.text} border border-slate-100 shadow-sm text-[8px]">${r[data.cols.domain] || 'ALGEMEEN'}</span></div>
                                <span class="font-bold text-slate-400 ml-1 tracking-wider uppercase italic text-[10px]">${mappedGrade}</span>
                            </div>
                            <div class="bg-slate-900/5 px-3 py-1 rounded-xl border border-white shadow-sm font-black italic text-sm">#${r[data.cols.code] || ''}</div>
                        </div>
                        <h3 class="text-slate-900 font-extrabold text-[15px] leading-snug mb-4 uppercase tracking-tighter">${r[data.cols.sub] || ''}</h3>
                        <div class="text-slate-700 text-[13px] leading-relaxed font-semibold bg-white/70 p-6 rounded-[2rem] border border-white/50 shadow-inner mb-4 flex-1">${r[data.cols.goal] || ''}</div>
                        <div class="mt-auto space-y-3">
                            <button onclick="toggleGoalSelection('${activeDisciplineName}', ${rawIdx}, this)" class="w-full py-4 text-white rounded-2xl font-black text-[10px] uppercase transition-all shadow-lg ${isSelected ? 'bg-red-500' : 'bg-blue-600'}">${isSelected ? '− Verwijderen' : '＋ Toevoegen aan lesfiche'}</button>
                            ${r[data.cols.example] ? `<button onclick="toggleExample(${idx})" id="btn-ex-${idx}" class="w-full py-3 rounded-2xl bg-slate-100 text-slate-400 text-[9px] font-black uppercase hover:bg-white transition-all">Praktijkvoorbeeld 💡</button><div id="ex-${idx}" class="hidden bg-white/60 p-5 rounded-2xl border border-white shadow-sm mt-2 text-slate-600 italic text-[12px]">"${r[data.cols.example]}"</div>` : ''}
                        </div>
                    </div>`;
                }
            }).join('');
        }

        // --- TOOLS ---
        function toggleGoalSelection(disc, rowIdx, btn) {
            const data = dataCache[disc];
            const item = data.rows[rowIdx];
            const goalId = (item[data.cols.code] || '') + item[data.cols.goal];
            const idx = selectedGoals.findIndex(g => (g.code + g.goal) === goalId);
            if (idx > -1) { selectedGoals.splice(idx, 1); }
            else { 
                selectedGoals.push({ disc, code: item[data.cols.code], sub: item[data.cols.sub], goal: item[data.cols.goal], grade: gradeMapping[(item[data.cols.grade] || "").trim()] || 'Algemeen' });
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.8 }, colors: [DISCIPLINES.find(d => d.name === disc).color, '#ffffff'] });
            }
            localStorage.setItem('mySelectedGoals', JSON.stringify(selectedGoals));
            updateSelectionUI(); render();
        }

        function updateSelectionUI() {
            document.getElementById('selection-counter').innerText = selectedGoals.length;
            const c = document.getElementById('selection-items');
            if (selectedGoals.length === 0) { c.innerHTML = `Leeg.`; return; }
            c.innerHTML = selectedGoals.map((g, i) => `<div class="bg-white p-5 rounded-3xl border shadow-sm relative text-left mb-3"><button onclick="removeFromSelection(${i})" class="absolute top-4 right-4 text-slate-300 hover:text-red-500 font-bold">✕</button><div class="text-[9px] font-black text-blue-600 uppercase mb-1">#${g.code} | ${g.disc}</div><div class="font-bold text-[11px] mb-2 leading-tight">${g.sub}</div><div class="text-[10px] text-slate-400 border-t pt-2">${g.goal}</div></div>`).join('');
        }

        function printSelection() {
            const area = document.getElementById('print-content-list');
            const title = document.getElementById('pdf-custom-title').value || "Lesdoelen";
            if (selectedGoals.length === 0) return alert("Leeg mandje!");
            document.getElementById('pdf-title-output').innerText = title;
            document.getElementById('print-date').innerText = "Vervaardigd op: " + new Date().toLocaleDateString('nl-BE');
            area.innerHTML = selectedGoals.map(g => `<div class="print-item"><strong>${g.disc} • ${g.grade} • #${g.code}</strong><h2 style="font-size:18px; font-weight:900; margin:10px 0;">${g.sub}</h2><p>${g.goal}</p></div>`).join('');
            setTimeout(() => window.print(), 500);
        }

        function setGrade(g, btn) { filterGrade = g; localStorage.setItem('preferredGrade', g); document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); if(btn) btn.classList.add('active'); render(); }
        function changeDiscipline(n) { showDiscipline(n); }
        function toggleFilterPane() { document.getElementById('filter-pane-content').classList.toggle('hidden'); document.getElementById('filter-chevron').innerText = document.getElementById('filter-pane-content').classList.contains('hidden') ? "+" : "−"; }
        function toggleLegend() { document.getElementById('legend-container').classList.toggle('hidden'); }
        function toggleSelectionDrawer() { document.getElementById('selection-list-box').classList.toggle('hidden'); }
        function toggleListRow(i) { document.getElementById(`list-detail-${i}`).classList.toggle('hidden'); }
        function toggleExample(i) { const e = document.getElementById(`ex-${i}`); e.classList.toggle('hidden'); document.getElementById(`btn-ex-${i}`).innerText = e.classList.contains('hidden') ? "Praktijkvoorbeeld 💡" : "Dichtklappen 🔼"; }
        function removeFromSelection(i) { selectedGoals.splice(i, 1); localStorage.setItem('mySelectedGoals', JSON.stringify(selectedGoals)); updateSelectionUI(); render(); }
        function clearSelection() { if(confirm("Lijst wissen?")) { selectedGoals = []; localStorage.removeItem('mySelectedGoals'); updateSelectionUI(); render(); } }
        function setView(m) { viewMode = m; localStorage.setItem('preferredView', m); document.getElementById('grid-view-btn').className = m === 'grid' ? "p-2 px-5 rounded-xl text-[10px] font-black uppercase transition-all bg-white/10 text-white shadow-inner" : "p-2 px-5 rounded-xl text-[10px] font-black uppercase text-slate-400"; document.getElementById('list-view-btn').className = m === 'list' ? "p-2 px-5 rounded-xl text-[10px] font-black uppercase bg-white/10 text-white shadow-inner" : "p-2 px-5 rounded-xl text-[10px] font-black uppercase text-slate-400"; render(); }
        function updateStatusBadge(s) { const e = document.getElementById('conn-status'); if(e) e.style.backgroundColor = s === 'live' ? '#10b981' : '#64748b'; }
        function getTheme(dom) { const d = (dom || "").toLowerCase(); if (d.includes("computationeel") || d.includes("ict")) return { text: "text-indigo-700" }; if (d.includes("getallen") || d.includes("taal")) return { text: "text-rose-700" }; if (d.includes("meten") || d.includes("techniek")) return { text: "text-amber-700" }; return { text: "text-blue-700" }; }

        window.onload = init;
    </script>
</body>
</html>
