<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-Leerplandoelen Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .filter-btn.active { background-color: #1e293b; color: white; border-color: #1e293b; transform: translateY(-1px); box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.1); }
        .goal-card { transition: transform 0.2s ease, box-shadow 0.2s ease; border-width: 1.5px; }
        .goal-card:hover { transform: translateY(-2px); box-shadow: 0 8px 12px -4px rgba(0,0,0,0.05); }
        .section-title { position: relative; padding-left: 0.8rem; }
        .section-title::before { content: ''; position: absolute; left: 0; top: 0.2rem; bottom: 0.2rem; width: 3px; background: #2563eb; border-radius: 2px; }
    </style>
</head>
<body class="bg-[#f9fafb] min-h-screen pb-12 text-slate-800 text-sm">

    <!-- Header -->
    <header class="bg-slate-900 text-white py-6 mb-6 shadow-lg">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tighter uppercase leading-none italic">
                    <span class="text-blue-500 italic uppercase">ICT-Leerplandoelen</span>
                </h1>
                <p class="text-slate-400 mt-2 font-medium tracking-widest text-[10px] uppercase opacity-80">Katholiek Onderwijs Vlaanderen</p>
            </div>
            <div id="conn-status" class="text-[9px] font-black px-4 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 uppercase tracking-[0.15em] shadow-inner">
                Database verbinden...
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4">
        
        <div id="main-content" class="hidden">
            <!-- Filter Dashboard -->
            <div class="bg-white p-5 md:p-8 rounded-[2rem] shadow-sm border border-slate-100 mb-8">
                
                <div class="mb-8">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-5">
                        <h2 class="section-title text-lg md:text-xl font-extrabold text-slate-800 tracking-tight italic">
                            Selecteer Jaar / Fase
                        </h2>
                        <button onclick="toggleLegend()" class="text-[10px] font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl hover:bg-blue-100 transition-all flex items-center justify-center gap-2 border border-blue-100">
                            <span id="legend-icon">ℹ️</span> <span id="legend-text">Toon info fasen</span>
                        </button>
                    </div>
                    
                    <div id="grade-buttons" class="flex flex-wrap gap-2">
                        <button onclick="location.reload()" id="btn-all" class="filter-btn active px-4 py-2 rounded-xl border border-slate-200 text-xs font-extrabold transition-all hover:bg-slate-50 shadow-sm">Alle doelen</button>
                    </div>
                </div>

                <!-- LEGENDE FASEN -->
                <div id="legend-container" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 p-6 bg-blue-50/50 rounded-[1.5rem] border border-blue-100 shadow-inner">
                    <div>
                        <h4 class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-2 flex items-center gap-2">
                            <span class="w-4 h-4 bg-blue-600 text-white rounded-full flex items-center justify-center text-[9px]">P</span> P-route (Fase 1-3)
                        </h4>
                        <ul class="text-xs text-slate-600 space-y-1 font-medium">
                            <li><strong class="text-blue-700 underline decoration-blue-200 underline-offset-1 font-bold">Fase 1:</strong> 0 tot 6/8 mnd</li>
                            <li><strong class="text-blue-700 underline decoration-blue-200 underline-offset-1 font-bold">Fase 2:</strong> 6 tot 18 mnd</li>
                            <li><strong class="text-blue-700 underline decoration-blue-200 underline-offset-1 font-bold">Fase 3:</strong> 18 mnd tot 2,5 j.</li>
                        </ul>
                    </div>
                    <div class="border-t md:border-t-0 md:border-l border-blue-200 pt-4 md:pt-0 md:pl-6">
                        <h4 class="text-[10px] font-black text-slate-800 uppercase tracking-widest mb-2 flex items-center gap-2">
                            <span class="w-4 h-4 bg-slate-800 text-white rounded-full flex items-center justify-center text-[9px]">S</span> S-route (Fase 4-6)
                        </h4>
                        <ul class="text-xs text-slate-600 space-y-1 font-medium">
                            <li><strong class="text-slate-800 underline decoration-slate-300 underline-offset-1 font-bold">Fase 4:</strong> + 2,5 jaar</li>
                            <li><strong class="text-slate-800 underline decoration-slate-300 underline-offset-1 font-bold">Fase 5:</strong> + 6 jaar</li>
                            <li><strong class="text-slate-800 underline decoration-slate-300 underline-offset-1 font-bold">Fase 6:</strong> + 10 jaar</li>
                        </ul>
                    </div>
                </div>

                <!-- Zoekbalken -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-slate-100 pt-6">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block italic text-xs">Snel zoeken</label>
                        <input type="text" id="search-input" onkeyup="render()" placeholder="Typ trefwoord..." class="w-full p-3 bg-slate-50 border-none rounded-xl outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 font-semibold text-slate-700 transition-all">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block italic text-xs">Domein filter</label>
                        <select id="domain-select" onchange="render()" class="w-full p-3 bg-slate-50 border-none rounded-xl outline-none font-bold appearance-none cursor-pointer ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 text-slate-700"></select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 block italic text-xs">Doelsoort</label>
                        <select id="type-select" onchange="render()" class="w-full p-3 bg-slate-50 border-none rounded-xl outline-none font-bold appearance-none cursor-pointer ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 text-slate-700">
                            <option value="all">Alle soorten</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- RESULTATEN BALK -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 px-4 gap-3">
                <div id="result-count" class="text-xs font-extrabold text-slate-400 uppercase tracking-widest italic"></div>
                <button id="master-toggle" onclick="toggleAllExamples()" class="w-full md:w-auto text-[9px] font-black text-slate-700 bg-white border border-slate-200 px-5 py-2.5 rounded-xl hover:bg-slate-800 hover:text-white transition-all shadow-sm uppercase tracking-tighter">
                    💡 TOON ALLE VOORBEELDEN
                </button>
            </div>

            <div id="goals-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-12"></div>
        </div>

        <!-- Loader -->
        <div id="loading-screen" class="flex flex-col items-center justify-center py-32 text-center">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4 shadow-sm"></div>
            <p id="loading-text" class="text-slate-400 font-bold uppercase tracking-widest text-[10px] animate-pulse">Laden...</p>
        </div>
    </main>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCFdDnFXhAe6lt-EzZ-VeHTg54dWNk-PuIDtYTN1hUd_yDxnhaUhdy1hQDx3QXjGtZIhmwUfIVe7az/pub?gid=1392774175&single=true&output=csv';
        
        let dataRows = [];
        let filterGrade = 'all';
        let allExamplesShown = false;
        let colNames = { grade: '', domain: '', type: '', code: '', sub: '', goal: '', example: '', vocab: '' };

        const gradeOrder = [
            "Fase 1", "Fase 2", "Fase 3", "Fase 4", "Fase 5", "Fase 6",
            "jongste kleuters", "2de kleuterklas", "3de kleuterklas",
            "Leerjaar 1", "Leerjaar 2", "Leerjaar 3", "Leerjaar 4", "Leerjaar 5", "Leerjaar 6",
            "Extra / Algemeen"
        ];

        async function init() {
            try {
                const response = await fetch(SHEET_URL);
                const csv = await response.text();
                Papa.parse(csv, {
                    header: true, skipEmptyLines: true,
                    complete: (results) => {
                        dataRows = results.data;
                        identifyColumns(results.meta.fields);
                        setupUI();
                    }
                });
            } catch (e) { document.getElementById('loading-text').innerText = "Fout: " + e.message; }
        }

        function identifyColumns(headers) {
            headers.forEach(h => {
                const lower = h.toLowerCase().trim();
                if (lower === 'code') colNames.code = h;
                if (lower.includes('jaar') || lower.includes('fase')) colNames.grade = h;
                if (lower === 'domein') colNames.domain = h;
                if (lower === 'soort') colNames.type = h;
                if (lower.includes('subdomein')) colNames.sub = h;
                if (lower.includes('leerplandoel')) colNames.goal = h;
                if (lower.includes('voorbeeld')) colNames.example = h;
                if (lower.includes('woordenschat')) colNames.vocab = h;
            });
        }

        function toggleLegend() {
            const container = document.getElementById('legend-container');
            const text = document.getElementById('legend-text');
            container.classList.toggle('hidden');
            text.innerText = container.classList.contains('hidden') ? "Toon info fasen" : "Verberg info";
        }

        function toggleExample(id) {
            const content = document.getElementById(`ex-${id}`);
            const btn = document.getElementById(`btn-ex-${id}`);
            const isHidden = content.classList.contains('hidden');
            content.classList.toggle('hidden');
            btn.innerText = isHidden ? "Verberg voorbeeld 🔼" : "Toon voorbeeld 💡";
            btn.classList.toggle('bg-slate-800', isHidden);
            btn.classList.toggle('text-white', isHidden);
        }

        function toggleAllExamples() {
            allExamplesShown = !allExamplesShown;
            const exDivs = document.querySelectorAll('[id^="ex-"]');
            const btns = document.querySelectorAll('[id^="btn-ex-"]');
            exDivs.forEach((d, i) => {
                if (allExamplesShown) {
                    d.classList.remove('hidden');
                    btns[i].innerText = "Verberg voorbeeld 🔼";
                    btns[i].classList.add('bg-slate-800', 'text-white');
                } else {
                    d.classList.add('hidden');
                    btns[i].innerText = "Toon voorbeeld 💡";
                    btns[i].classList.remove('bg-slate-800', 'text-white');
                }
            });
            document.getElementById('master-toggle').innerText = allExamplesShown ? "🔝 VERBERG VOORBEELDEN" : "💡 TOON VOORBEELDEN";
        }

        function getTheme(domein) {
            const d = (domein || "").toLowerCase();
            if (d.includes("computationeel")) return { bg: "bg-indigo-50/70", border: "border-indigo-100", text: "text-indigo-700" };
            if (d.includes("veiligheid")) return { bg: "bg-rose-50/70", border: "border-rose-100", text: "text-rose-700" };
            if (d.includes("mediawijsheid")) return { bg: "bg-amber-50/70", border: "border-amber-100", text: "text-amber-700" };
            if (d.includes("creatie")) return { bg: "bg-emerald-50/70", border: "border-emerald-100", text: "text-emerald-700" };
            return { bg: "bg-blue-50/70", border: "border-blue-100", text: "text-blue-700" };
        }

        function setupUI() {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('conn-status').innerText = "DATA: LIVE";
            document.getElementById('conn-status').className = "hidden md:block text-[9px] font-black px-4 py-1.5 rounded-full bg-green-600 text-white uppercase tracking-widest shadow-md";

            let uniqueGrades = [...new Set(dataRows.map(r => r[colNames.grade]?.trim() || "Extra / Algemeen"))];
            uniqueGrades.sort((a, b) => {
                let iA = gradeOrder.indexOf(a); let iB = gradeOrder.indexOf(b);
                return (iA === -1 ? 999 : iA) - (iB === -1 ? 999 : iB);
            });

            const gCont = document.getElementById('grade-buttons');
            uniqueGrades.forEach(g => {
                const btn = document.createElement('button');
                btn.className = "filter-btn px-4 py-2 rounded-xl border border-slate-200 text-[11px] font-extrabold transition-all hover:bg-slate-50 shadow-sm";
                btn.innerText = g;
                btn.onclick = () => {
                    filterGrade = g;
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    render();
                };
                gCont.appendChild(btn);
            });

            const domains = [...new Set(dataRows.map(r => r[colNames.domain]))].filter(Boolean).sort();
            const dSel = document.getElementById('domain-select');
            dSel.innerHTML = '<option value="all">Alle domeinen</option>';
            domains.forEach(d => dSel.innerHTML += `<option value="${d}">${d}</option>`);

            const types = [...new Set(dataRows.map(r => r[colNames.type]))].filter(Boolean).sort();
            const tSel = document.getElementById('type-select');
            types.forEach(t => tSel.innerHTML += `<option value="${t}">Soort: ${t}</option>`);

            render();
        }

        function render() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const domF = document.getElementById('domain-select').value;
            const typF = document.getElementById('type-select').value;
            const grid = document.getElementById('goals-grid');
            
            const filtered = dataRows.filter(r => {
                const curVal = r[colNames.grade]?.trim() || "Extra / Algemeen";
                const mG = filterGrade === 'all' || curVal === filterGrade;
                const mD = domF === 'all' || r[colNames.domain] === domF;
                const mT = typF === 'all' || r[colNames.type] === typF;
                const mS = (r[colNames.goal] || "").toLowerCase().includes(query) || (r[colNames.example] || "").toLowerCase().includes(query) || (r[colNames.sub] || "").toLowerCase().includes(query) || (r[colNames.vocab] || "").toLowerCase().includes(query);
                return mG && mD && mT && mS;
            });

            document.getElementById('result-count').innerText = `${filtered.length} DOELEN`;
            grid.innerHTML = '';

            filtered.forEach((r, idx) => {
                const theme = getTheme(r[colNames.domain]);
                const card = document.createElement('div');
                card.className = `goal-card ${theme.bg} ${theme.border} p-5 md:p-6 rounded-[2.5rem] flex flex-col shadow-sm border-2`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4 text-[9px]">
                        <div class="flex flex-col gap-1">
                            <div class="flex gap-1.5">
                                <span class="px-2 py-0.5 rounded-full font-black uppercase tracking-wider bg-white ${theme.text} border border-slate-100 shadow-sm">${r[colNames.domain] || 'ICT'}</span>
                                <span class="px-2 py-0.5 rounded-full font-black uppercase tracking-wider bg-slate-900 text-white shadow-sm">${r[colNames.type] || 'G'}</span>
                            </div>
                            <span class="font-bold text-slate-400 ml-1 tracking-wider uppercase italic">${r[colNames.grade] || 'Algemeen'}</span>
                        </div>
                        <div class="bg-white/90 px-3 py-1 rounded-lg border border-white shadow-sm font-black ${theme.text} italic text-xs leading-none">#${r[colNames.code] || ''}</div>
                    </div>
                    
                    <h3 class="text-slate-900 font-extrabold text-[13px] md:text-sm leading-snug mb-3 uppercase tracking-tight">${r[colNames.sub] || ''}</h3>

                    <div class="text-slate-700 text-[12px] leading-relaxed font-semibold bg-white/70 p-4 rounded-[1.8rem] border border-white/50 shadow-inner mb-3">
                        ${r[colNames.goal] || ''}
                    </div>

                    ${r[colNames.vocab] ? `
                    <div class="flex items-start gap-1.5 px-3 mb-3 opacity-80">
                        <span class="text-[9px] mt-0.5">🏷️</span>
                        <p class="text-[10px] font-bold text-slate-500 italic leading-tight">
                            <span class="uppercase text-[8px] not-italic tracking-wider opacity-60">Woordenschat:</span> ${r[colNames.vocab]}
                        </p>
                    </div>
                    ` : ''}
                    
                    ${r[colNames.example] ? `
                    <div id="ex-${idx}" class="hidden bg-white/50 p-4 rounded-xl border border-white shadow-sm mb-3">
                        <p class="text-slate-600 text-[11px] italic leading-relaxed font-medium">"${r[colNames.example]}"</p>
                    </div>
                    <button id="btn-ex-${idx}" onclick="toggleExample(${idx})" class="w-full py-2.5 rounded-xl bg-white/60 text-slate-600 text-[8px] font-black uppercase tracking-widest hover:bg-slate-800 hover:text-white transition-all border border-white/50 shadow-sm">
                        Toon praktijkvoorbeeld 💡
                    </button>
                    ` : ''}
                `;
                grid.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
