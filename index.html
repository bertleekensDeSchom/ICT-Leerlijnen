<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT-Leerplandoelen Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .filter-btn.active { background-color: #1e293b !important; color: white !important; border-color: #1e293b !important; }
        .goal-card { transition: all 0.2s ease; border-width: 1.5px; }
        .goal-card:hover { transform: translateY(-2px); box-shadow: 0 8px 12px -4px rgba(0,0,0,0.05); }
        .section-title { position: relative; padding-left: 1.2rem; cursor: pointer; }
        .section-title::before { content: ''; position: absolute; left: 0; top: 0.2rem; bottom: 0.2rem; width: 5px; background: #2563eb; border-radius: 4px; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f9fafb] min-h-screen pb-20 text-slate-800 text-[13px]">

    <!-- Header -->
    <header class="bg-slate-900 text-white py-5 mb-6 shadow-lg">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left">
            <div>
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tighter uppercase leading-none italic text-blue-500">
                    ICT-LEERPLANDOELEN
                </h1>
                <p class="text-slate-400 mt-1 font-medium tracking-widest text-[10px] uppercase opacity-80">Dashboard & Selectie-tool</p>
            </div>
            <div id="conn-status" class="text-[9px] font-black px-4 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 uppercase tracking-[0.15em]">
                Status: Laden...
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4">
        
        <div id="main-content" class="hidden">
            <!-- Filter Dashboard -->
            <div class="bg-white rounded-[2rem] shadow-md border border-slate-100 mb-8 overflow-hidden">
                <div onclick="toggleFilterPane()" class="p-4 md:px-10 md:py-6 flex justify-between items-center hover:bg-slate-50 transition-colors group cursor-pointer border-b border-slate-50">
                    <h2 class="section-title text-xl md:text-2xl font-extrabold text-slate-900 tracking-tight italic">
                        Filteropties & Jaar / Fase
                    </h2>
                    <span id="filter-chevron" class="text-slate-400 group-hover:text-blue-600 transition-all font-black text-2xl">−</span>
                </div>
                
                <div id="filter-pane-content" class="px-6 md:px-10 pb-8 pt-4 space-y-4">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Selecteer een jaar of fase</label>
                            <button onclick="toggleLegend()" class="text-[10px] font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-100 shadow-sm hover:bg-blue-100 transition-all">ℹ️ Legende fasen</button>
                        </div>
                        <div id="grade-buttons" class="flex flex-wrap gap-2 md:gap-3">
                            <button onclick="location.reload()" id="btn-all" class="filter-btn active px-4 py-2 rounded-xl border border-slate-200 text-[10px] font-extrabold transition-all hover:bg-slate-50 shadow-sm uppercase tracking-tighter">Alle doelen</button>
                        </div>
                    </div>

                    <!-- LEGENDE FASEN -->
                    <div id="legend-container" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 p-5 bg-blue-50/50 rounded-[1.5rem] border border-blue-100 shadow-inner">
                        <div class="text-[11px] text-slate-600 leading-relaxed">
                            <h4 class="font-black text-blue-600 uppercase mb-1 text-[10px]">P-route (Fase 1-3)</h4>
                            <p><strong>F1:</strong> 0-8 mnd | <strong>F2:</strong> 6-18 mnd | <strong>F3:</strong> 18 mnd-2,5 j.</p>
                        </div>
                        <div class="text-[11px] text-slate-600 leading-relaxed border-l border-blue-100 pl-6">
                            <h4 class="font-black text-slate-800 uppercase mb-1 text-[10px]">S-route (Fase 4-6)</h4>
                            <p><strong>F4:</strong> +2,5 j. | <strong>F5:</strong> +6 j. | <strong>F6:</strong> +10 j.</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4 border-t border-slate-100">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 block italic">Zoek op tekst</label>
                            <input type="text" id="search-input" onkeyup="render()" placeholder="Typ trefwoord..." class="w-full p-3 bg-slate-50 border-none rounded-xl ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 font-semibold text-slate-700 text-[10px]">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 block italic">Domein</label>
                            <select id="domain-select" onchange="render()" class="w-full p-3 bg-slate-50 border-none rounded-xl ring-1 ring-slate-200 font-bold appearance-none cursor-pointer text-[10px]"></select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1.5 block italic">Doelsoort</label>
                            <select id="type-select" onchange="render()" class="w-full p-3 bg-slate-50 border-none rounded-xl ring-1 ring-slate-200 font-bold appearance-none cursor-pointer text-[10px]">
                                <option value="all">Alle doelsoorten</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RESULTATEN BALK -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 px-4 gap-4">
                <div id="result-count" class="text-xs font-bold text-slate-400 uppercase tracking-widest italic font-mono"></div>
                <button id="master-toggle" onclick="toggleAllExamples()" class="w-full md:w-auto text-[9px] font-black text-slate-700 bg-white border border-slate-200 px-6 py-3 rounded-2xl hover:bg-slate-800 hover:text-white transition-all shadow-sm">💡 TOON ALLE VOORBEELDEN</button>
            </div>

            <div id="goals-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 pb-24"></div>
        </div>

        <!-- SELECTION DRAWER (Winkelmandje) -->
        <div id="selection-drawer" class="fixed bottom-6 right-6 z-[100] flex flex-col items-end">
            <div id="selection-list-box" class="hidden mb-4 w-80 md:w-[380px] bg-white rounded-[2.5rem] shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[70vh]">
                <div class="p-6 bg-slate-900 text-white flex justify-between items-center">
                    <h3 class="font-black text-xs uppercase tracking-widest italic text-blue-400">Mijn Les-Doelen</h3>
                    <button onclick="clearSelection()" class="text-[10px] underline opacity-70 hover:opacity-100 font-bold">WIS ALLES</button>
                </div>
                <div id="selection-items" class="p-6 overflow-y-auto bg-slate-50 space-y-3 flex-1 scrollbar-hide">
                    <p class="text-slate-400 italic text-center py-10 text-xs">Nog geen doelen toegevoegd.</p>
                </div>
                <div class="p-6 bg-white border-t border-slate-100">
                    <button id="copy-btn" onclick="exportSelection(event)" class="w-full py-4 bg-blue-600 text-white rounded-[1.2rem] font-black text-[10px] uppercase tracking-widest hover:bg-blue-700 transition-all shadow-lg">
                        📋 Kopieer voor lesfiche
                    </button>
                </div>
            </div>
            <button onclick="toggleSelectionDrawer()" class="p-5 bg-blue-600 text-white rounded-[2rem] shadow-2xl hover:scale-105 transition-all flex items-center gap-4 ring-8 ring-white relative">
                <span class="text-2xl font-bold leading-none">📋</span>
                <span id="selection-counter" class="font-black text-xl leading-none">0</span>
            </button>
        </div>

        <!-- Loader -->
        <div id="loading-screen" class="flex flex-col items-center justify-center py-40 text-center">
            <div class="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4 shadow-sm"></div>
            <p id="loading-text" class="text-slate-400 font-bold uppercase tracking-widest text-[10px] animate-pulse">Data inladen...</p>
        </div>
    </main>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCFdDnFXhAe6lt-EzZ-VeHTg54dWNk-PuIDtYTN1hUd_yDxnhaUhdy1hQDx3QXjGtZIhmwUfIVe7az/pub?gid=1392774175&single=true&output=csv';
        
        let dataRows = [];
        let selectedGoals = [];
        let filterGrade = 'all';
        let allExamplesShown = false;
        let colNames = { grade: '', domain: '', type: '', code: '', sub: '', goal: '', example: '', vocab: '' };

        const gradeOrder = ["Fase 1", "Fase 2", "Fase 3", "Fase 4", "Fase 5", "Fase 6", "jongste kleuters", "2de kleuterklas", "3de kleuterklas", "Leerjaar 1", "Leerjaar 2", "Leerjaar 3", "Leerjaar 4", "Leerjaar 5", "Leerjaar 6", "Extra / Algemeen"];

        async function init() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error("Netwerk response was niet ok.");
                const csv = await response.text();
                Papa.parse(csv, {
                    header: true, skipEmptyLines: true,
                    complete: (results) => {
                        dataRows = results.data;
                        identifyColumns(results.meta.fields || []);
                        setupUI();
                    },
                    error: (err) => { throw new Error("CSV parsing fout."); }
                });
            } catch (e) {
                document.getElementById('loading-text').innerText = "FOUT: " + e.message;
                console.error(e);
            }
        }

        function identifyColumns(headers) {
            headers.forEach(h => {
                const l = h.toLowerCase().trim();
                if (l === 'code') colNames.code = h;
                else if (l.includes('jaar') || l.includes('fase')) colNames.grade = h;
                else if (l.includes('domein') && !l.includes('sub')) colNames.domain = h;
                else if (l.includes('soort')) colNames.type = h;
                else if (l.includes('subdomein')) colNames.sub = h;
                else if (l.includes('leerplandoel')) colNames.goal = h;
                else if (l.includes('voorbeeld')) colNames.example = h;
                else if (l.includes('woordenschat')) colNames.vocab = h;
            });
        }

        function toggleFilterPane() {
            const content = document.getElementById('filter-pane-content');
            const chevron = document.getElementById('filter-chevron');
            const isHidden = content.classList.toggle('hidden');
            chevron.innerText = isHidden ? "+" : "−";
        }

        function toggleLegend() { document.getElementById('legend-container').classList.toggle('hidden'); }
        function toggleSelectionDrawer() { document.getElementById('selection-list-box').classList.toggle('hidden'); }

        function addToSelection(idx) {
            const item = dataRows[idx];
            if (!selectedGoals.find(g => g.code === item[colNames.code] && g.goal === item[colNames.goal])) {
                selectedGoals.push({
                    code: item[colNames.code] || 'N/A',
                    goal: item[colNames.goal] || '',
                    sub: item[colNames.sub] || '',
                    vocab: item[colNames.vocab] || ''
                });
                updateSelectionUI();
            }
        }

        function removeFromSelection(idx) {
            selectedGoals.splice(idx, 1);
            updateSelectionUI();
        }

        function clearSelection() {
            selectedGoals = [];
            updateSelectionUI();
        }

        function updateSelectionUI() {
            document.getElementById('selection-counter').innerText = selectedGoals.length;
            const container = document.getElementById('selection-items');
            if (selectedGoals.length === 0) {
                container.innerHTML = `<p class="text-slate-400 italic text-center py-10 text-xs">Nog geen doelen toegevoegd.</p>`;
                return;
            }
            container.innerHTML = selectedGoals.map((g, i) => `
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm relative group">
                    <button onclick="removeFromSelection(${i})" class="absolute top-2 right-2 text-slate-300 hover:text-red-500 font-bold">✕</button>
                    <div class="text-[9px] font-black text-blue-600 mb-1 leading-none uppercase">#${g.code}</div>
                    <div class="text-[10px] font-extrabold text-slate-800 leading-tight pr-4 uppercase tracking-tighter">${g.sub}</div>
                </div>
            `).join('');
        }

        function exportSelection(e) {
            if (selectedGoals.length === 0) return;
            const btn = document.getElementById('copy-btn');
            const text = selectedGoals.map(g => 
                `DOEL: ${g.code} - ${g.sub}\nBESCHRIJVING: ${g.goal}${g.vocab ? '\nWOORDENSCHAT: ' + g.vocab : ''}\n`
            ).join('\n--------------------------\n');
            
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerHTML;
                btn.innerText = "✅ GEKOPIEERD!";
                setTimeout(() => { btn.innerHTML = originalText; }, 2000);
            });
        }

        function toggleExample(id) {
            const content = document.getElementById(`ex-${id}`);
            const btn = document.getElementById(`btn-ex-${id}`);
            const isHidden = content.classList.toggle('hidden');
            btn.innerText = isHidden ? "Toon praktijkvoorbeeld 💡" : "Verberg voorbeeld 🔼";
            btn.classList.toggle('bg-slate-800', !isHidden);
            btn.classList.toggle('text-white', !isHidden);
        }

        function toggleAllExamples() {
            allExamplesShown = !allExamplesShown;
            document.querySelectorAll('[id^="ex-"]').forEach((d, i) => {
                const btn = document.querySelectorAll('[id^="btn-ex-"]')[i];
                if (allExamplesShown) { d.classList.remove('hidden'); btn.innerText = "Verberg voorbeeld 🔼"; btn.classList.add('bg-slate-800', 'text-white'); }
                else { d.classList.add('hidden'); btn.innerText = "Toon praktijkvoorbeeld 💡"; btn.classList.remove('bg-slate-800', 'text-white'); }
            });
            document.getElementById('master-toggle').innerText = allExamplesShown ? "🔝 VERBERG VOORBEELDEN" : "💡 TOON VOORBEELDEN";
        }

        function getTheme(domein) {
            const d = (domein || "").toLowerCase();
            if (d.includes("computationeel")) return { bg: "bg-indigo-50/70", border: "border-indigo-100", text: "text-indigo-700" };
            if (d.includes("veiligheid")) return { bg: "bg-rose-50/70", border: "border-rose-100", text: "text-rose-700" };
            if (d.includes("mediawijsheid")) return { bg: "bg-amber-50/70", border: "border-amber-100", text: "text-amber-700" };
            if (d.includes("creatie")) return { bg: "bg-emerald-50/70", border: "border-emerald-100", text: "text-emerald-700" };
            return { bg: "bg-blue-50/70", border: "border-blue-100", text: "text-blue-700" };
        }

        function setupUI() {
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('conn-status').innerText = "ONLINE";
            document.getElementById('conn-status').classList.replace('text-slate-400', 'text-green-400');

            const gradeKey = colNames.grade;
            let uniqueGrades = [...new Set(dataRows.map(r => (r[gradeKey] || "").trim() || "Extra / Algemeen"))];
            uniqueGrades.sort((a, b) => {
                let iA = gradeOrder.indexOf(a); let iB = gradeOrder.indexOf(b);
                return (iA === -1 ? 999 : iA) - (iB === -1 ? 999 : iB);
            });

            const gCont = document.getElementById('grade-buttons');
            uniqueGrades.forEach(g => {
                const btn = document.createElement('button');
                btn.className = "filter-btn px-4 py-2 rounded-xl border border-slate-200 text-[10px] font-extrabold transition-all hover:bg-slate-50 shadow-sm uppercase tracking-tighter";
                btn.innerText = g;
                btn.onclick = () => { filterGrade = g; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); };
                gCont.appendChild(btn);
            });

            const domKey = colNames.domain;
            const domains = [...new Set(dataRows.map(r => r[domKey]))].filter(Boolean).sort();
            document.getElementById('domain-select').innerHTML = '<option value="all">Alle domeinen</option>' + domains.map(d => `<option value="${d}">${d}</option>`).join('');

            const typeKey = colNames.type;
            const types = [...new Set(dataRows.map(r => r[typeKey]))].filter(Boolean).sort();
            document.getElementById('type-select').innerHTML = '<option value="all">Alle doelsoorten</option>' + types.map(t => `<option value="${t}">Soort: ${t}</option>`).join('');

            render();
        }

        function render() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const domF = document.getElementById('domain-select').value;
            const typF = document.getElementById('type-select').value;
            const grid = document.getElementById('goals-grid');
            
            const filtered = dataRows.filter(r => {
                const curGradeVal = (r[colNames.grade] || "").trim() || "Extra / Algemeen";
                const mG = (filterGrade === 'all' || curGradeVal === filterGrade);
                const mD = (domF === 'all' || r[colNames.domain] === domF);
                const mT = (typF === 'all' || r[colNames.type] === typF);
                const mS = ( (r[colNames.goal] || "").toLowerCase().includes(query) || (r[colNames.example] || "").toLowerCase().includes(query) || (r[colNames.sub] || "").toLowerCase().includes(query) || (r[colNames.vocab] || "").toLowerCase().includes(query) );
                return mG && mD && mT && mS;
            });

            document.getElementById('result-count').innerText = `${filtered.length} DOELEN GEVONDEN`;
            grid.innerHTML = '';
            
            filtered.forEach((r, idx) => {
                const theme = getTheme(r[colNames.domain]);
                const rawIdx = dataRows.indexOf(r);
                const card = document.createElement('div');
                card.className = `goal-card ${theme.bg} ${theme.border} p-5 md:p-6 rounded-[2.5rem] flex flex-col shadow-sm border-2`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4 text-[9px]">
                        <div class="flex flex-col gap-1">
                            <div class="flex gap-1.5">
                                <span class="px-2 py-0.5 rounded-full font-black uppercase bg-white ${theme.text} border border-slate-100 shadow-sm">${r[colNames.domain] || 'ICT'}</span>
                                <span class="px-2 py-0.5 rounded-full font-black uppercase bg-slate-900 text-white shadow-sm">${r[colNames.type] || 'G'}</span>
                            </div>
                            <span class="font-bold text-slate-400 ml-1 tracking-wider uppercase italic">${r[colNames.grade] || 'Algemeen'}</span>
                        </div>
                        <div class="bg-white/90 px-3 py-1 rounded-lg border border-white shadow-sm font-black ${theme.text} italic text-xs leading-none">#${r[colNames.code] || ''}</div>
                    </div>
                    <h3 class="text-slate-900 font-extrabold text-[13px] md:text-sm leading-snug mb-3 uppercase tracking-tight">${r[colNames.sub] || ''}</h3>
                    <div class="text-slate-700 text-[12px] leading-relaxed font-semibold bg-white/70 p-4 rounded-[1.8rem] border border-white/50 shadow-inner mb-3">${r[colNames.goal] || ''}</div>
                    ${r[colNames.vocab] ? `<div class="flex items-start gap-1.5 px-3 mb-3 opacity-80"><span class="text-[9px] mt-0.5">🏷️</span><p class="text-[10px] font-bold text-slate-500 italic leading-tight"><span class="uppercase text-[8px] not-italic tracking-wider opacity-60">Woordenschat:</span> ${r[colNames.vocab]}</p></div>` : ''}
                    <div class="mt-auto space-y-2">
                        <button onclick="addToSelection(${rawIdx})" class="w-full py-2.5 rounded-xl bg-blue-600 text-white text-[9px] font-black uppercase tracking-widest hover:bg-blue-700 transition-all shadow-md">➕ Toevoegen aan lesfiche</button>
                        ${r[colNames.example] ? `
                            <div id="ex-${idx}" class="hidden bg-white/50 p-4 rounded-xl border border-white shadow-sm mb-2"><p class="text-slate-600 text-[11px] italic leading-relaxed font-medium">"${r[colNames.example]}"</p></div>
                            <button id="btn-ex-${idx}" onclick="toggleExample(${idx})" class="w-full py-2.5 rounded-xl bg-white/60 text-slate-600 text-[8px] font-black uppercase tracking-widest hover:bg-white transition-all border border-white/50 shadow-sm">Toon praktijkvoorbeeld 💡</button>
                        ` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
